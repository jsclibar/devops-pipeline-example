name: devops-pipeline-example

services:
  api:
    image: devops-pipeline-example-api:dev

    container_name: devops-pipeline-example-api

    build:
      context: .
      dockerfile: docker/python/Dockerfile

    volumes:
      - ./backend_app.py:/app/backend_app.py

    command: uvicorn backend_app:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: devops-pipeline-example-web:dev

    container_name: devops-pipeline-example-web

    build:
      context: .
      dockerfile: docker/nginx/Dockerfile

    ports:
      - "8080:80"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - api