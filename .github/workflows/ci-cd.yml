# Nome exibido na aba Actions do GitHub.
name: CI da API e do Nginx

# Define quando este workflow pode executar.
on:
  # Execução automática quando alterações são enviadas.
  push:
    # Executa automaticamente apenas na branch main.
    branches: [main]

  # Permite iniciar manualmente pelo botão "Run workflow".
  workflow_dispatch:

# Define as permissões do token automático do GitHub.
permissions:
  # Permite obter o código do repositório.
  contents: read

  # Permite publicar imagens no GitHub Container Registry.
  packages: write

# Agrupa os trabalhos do workflow.
jobs:
  # Identificador do nosso único trabalho.
  pipeline:
    # Usa uma máquina temporária Ubuntu fornecida pelo GitHub.
    # Essa máquina já possui Docker instalado.
    runs-on: ubuntu-latest

    # Os passos executam em sequência na mesma máquina.
    # Se um passo falhar, os seguintes não executam por padrão.
    steps:
      # Primeiro passo: obter os arquivos do projeto.
      - name: Obter código do projeto

        # "uses" executa uma ação pronta.
        # checkout obtém o código do repositório.
        # @v6 indica a versão dessa ação.
        uses: actions/checkout@v6

      # Segundo passo: preparar o Python.
      - name: Preparar Python

        # Disponibiliza o Python na máquina.
        uses: actions/setup-python@v6

        # "with" fornece opções para a ação acima.
        with:
          # Versão do Python utilizada nos testes.
          python-version: "3.13"

      # Verifica a aplicação antes de construir as imagens.
      - name: Testar aplicação

        # "run" executa comandos no terminal.
        # O símbolo | permite escrever várias linhas.
        run: |
          # Instala as dependências da aplicação e dos testes.
          # -r indica o arquivo que lista essas dependências.
          python -m pip install -r requirements-dev.txt

          # Executa os testes existentes no projeto.
          # -v mostra o nome e o resultado de cada teste.
          # Se algum teste falhar, a publicação não será executada.
          python -m pytest -v

      # Autentica o Docker para permitir a publicação das imagens.
      - name: Autenticar no GHCR

        # "env" disponibiliza variáveis para este passo.
        env:
          # TOKEN é o nome escolhido por nós para esta variável.
          #
          # ${{ ... }} é uma expressão interpretada pelo Actions.
          # secrets.GITHUB_TOKEN acessa o token temporário
          # fornecido automaticamente pelo GitHub.
          #
          # Não é necessário criar um token pessoal.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

        # Executa a autenticação.
        run: |
          # $TOKEN acessa a variável declarada em env.
          #
          # echo fornece o token.
          # O símbolo | encaminha esse valor ao docker login.
          #
          # ghcr.io é o registry do GitHub.
          #
          # -u informa o usuário.
          # GITHUB_ACTOR é preenchido automaticamente pelo GitHub
          # e identifica quem iniciou a execução.
          #
          # --password-stdin recebe a credencial pela entrada
          # do comando, através do |.
          #
          # A barra invertida continua o comando na linha seguinte.
          echo "$TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" \
            --password-stdin

      # Constrói a imagem Docker da aplicação Python.
      - name: Construir imagem da API

        # Define explicitamente Bash para interpretar os comandos.
        # A expressão que abrevia o commit abaixo utiliza Bash.
        shell: bash

        # Comandos executados neste passo.
        run: |
          # GITHUB_SHA contém o identificador completo do commit.
          # Essa variável é fornecida automaticamente pelo GitHub.
          #
          # ${GITHUB_SHA:0:7} pega 7 caracteres a partir da posição 0.
          # Exemplo: 77bdc943c5... passa a ser 77bdc94.
          #
          # Guardamos esse resultado em uma variável chamada TAG.
          # Na atribuição abaixo, não coloque espaços em torno do =.
          TAG=${GITHUB_SHA:0:7}

          # docker build constrói uma imagem.
          #
          # -t define o nome e a tag:
          #   ghcr.io = registry;
          #   jsclibar = proprietário do pacote;
          #   devops-pipeline-example-api = nome da imagem;
          #   $TAG = versão identificada pelo commit abreviado.
          #
          # -f informa o Dockerfile da API.
          #
          # O ponto final usa a raiz do projeto como contexto
          # de construção, permitindo copiar os arquivos necessários.
          docker build \
            -t ghcr.io/jsclibar/devops-pipeline-example-api:$TAG \
            -f docker/python/Dockerfile .

      # Constrói a imagem Docker do proxy reverso Nginx.
      - name: Construir imagem do Nginx

        # Utiliza Bash, como no passo anterior.
        shell: bash

        # Comandos executados neste passo.
        run: |
          # Calcula novamente a tag porque este passo abre
          # outro processo de terminal.
          #
          # A variável TAG criada no passo anterior não é
          # transferida automaticamente para este passo.
          #
          # GITHUB_SHA continua disponível, pois é uma variável
          # automática do GitHub em todos esses passos.
          TAG=${GITHUB_SHA:0:7}

          # Constrói a imagem do Nginx com a mesma tag da API.
          #
          # O nome termina em -web para manter o padrão
          # das imagens utilizadas no projeto.
          #
          # Utiliza o Dockerfile específico do Nginx.
          # O contexto continua sendo a raiz do projeto.
          docker build \
            -t ghcr.io/jsclibar/devops-pipeline-example-web:$TAG \
            -f docker/nginx/Dockerfile .

      # Publica as duas imagens construídas.
      - name: Publicar imagens no GHCR

        # Utiliza Bash para abreviar o identificador do commit.
        shell: bash

        # Comandos executados neste passo.
        run: |
          # Recupera a mesma tag usada nas duas construções.
          TAG=${GITHUB_SHA:0:7}

          # Envia a imagem da API para o GHCR.
          # Nome e tag são iguais aos utilizados no build.
          docker push ghcr.io/jsclibar/devops-pipeline-example-api:$TAG

          # Envia a imagem do Nginx para o GHCR.
          # A autenticação continua disponível porque estamos
          # na mesma máquina do passo de login.
          docker push ghcr.io/jsclibar/devops-pipeline-example-web:$TAG